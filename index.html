<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Ember · Expense Tracker</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --income: #16a34a;
      --expense: #dc2626;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.4);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 36px 20px 32px;
      text-align: center;
    }
    header h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    header p {
      color: #cbd5e1;
      font-size: 15px;
      opacity: 0.9;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .card, .panel {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card {
      text-align: center;
      padding: 18px 12px;
    }
    .card span {
      display: block;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .card strong {
      display: block;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .income { color: var(--income); }
    .expense { color: var(--expense); }
    h2 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .panel { margin-bottom: 16px; }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      display: grid;
      gap: 6px;
    }
    input, select, button {
      font: inherit;
      border-radius: 12px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    button {
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: var(--primary-hover); }
    button:active { transform: scale(0.98); }
    .full { grid-column: 1 / -1; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .toolbar h2 { margin: 0; }
    .toolbar select { max-width: 150px; font-size: 14px; }
    .transaction {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .transaction:last-child { border-bottom: none; }
    .tx-name { font-weight: 600; font-size: 15px; }
    .tx-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .tx-right { text-align: right; }
    .tx-amount { font-weight: 700; font-size: 15.5px; }
    .delete {
      width: auto;
      padding: 6px 11px;
      margin-top: 6px;
      background: transparent;
      color: var(--expense);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--expense);
      border-radius: 8px;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 32px 0;
      font-size: 14.5px;
    }
    .budget-bar, .cat-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      margin-top: 10px;
      overflow: hidden;
    }
    .budget-fill, .cat-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .category-list { display: flex; flex-direction: column; gap: 14px; }
    .cat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14.5px;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      padding: 20px 16px 40px;
    }
    @media (max-width: 540px) {
      main { padding: 16px 12px 32px; }
      .cards { gap: 8px; }
      .card { padding: 14px 8px; }
      .card strong { font-size: 17px; }
      form { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      header { padding: 28px 16px 24px; }
      header h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🔥 Ember</h1>
    <p>Your simple personal finance tracker</p>
  </header>

  <main>
    <section class="cards">
      <div class="card">
        <span>Balance</span>
        <strong id="balance">₦0.00</strong>
      </div>
      <div class="card">
        <span>Income</span>
        <strong class="income" id="income">₦0.00</strong>
      </div>
      <div class="card">
        <span>Expenses</span>
        <strong class="expense" id="expenses">₦0.00</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Monthly Budget</h2>
      <label>
        Set monthly expense limit (₦)
        <input id="budget-input" type="number" min="0" step="1000" placeholder="e.g. 150000">
      </label>
      <button id="save-budget" class="full" style="margin-top:12px;">Save Budget</button>
      <div id="budget-status" style="margin-top:14px;"></div>
    </section>

    <section class="panel">
      <h2>Add a transaction</h2>
      <form id="transaction-form">
        <label>
          Description
          <input id="description" type="text" maxlength="80" placeholder="e.g. Internet subscription" required>
        </label>
        <label>
          Amount (₦)
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="5000" required>
        </label>
        <label>
          Type
          <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </label>
        <label>
          Category
          <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Shopping</option>
            <option>Salary</option>
            <option>Freelance</option>
            <option>Education</option>
            <option>Other</option>
          </select>
        </label>
        <label class="full">
          Date
          <input id="date" type="date" required>
        </label>
        <button class="full" type="submit">+ Add transaction</button>
      </form>
    </section>

    <section class="panel" id="category-panel" style="display:none;">
      <h2>Spending by Category</h2>
      <div class="category-list" id="category-list"></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2>Recent transactions</h2>
        <select id="filter">
          <option value="all">All activity</option>
          <option value="income">Income only</option>
          <option value="expense">Expenses only</option>
        </select>
      </div>
      <div id="transaction-list"></div>
    </section>
  </main>

  <footer>Ember Expense Tracker · Your data stays in this browser.</footer>

  <script>
    const STORAGE_KEY = "ember-expense-tracker-v1";
    const BUDGET_KEY = "ember-budget";
    const form = document.getElementById("transaction-form");
    const list = document.getElementById("transaction-list");
    const filter = document.getElementById("filter");
    const budgetInput = document.getElementById("budget-input");
    const saveBudgetBtn = document.getElementById("save-budget");
    const budgetStatus = document.getElementById("budget-status");
    const categoryPanel = document.getElementById("category-panel");
    const categoryList = document.getElementById("category-list");

    let transactions = [];
    let monthlyBudget = Number(localStorage.getItem(BUDGET_KEY)) || 0;

    try {
      transactions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(transactions)) transactions = [];
    } catch { transactions = []; }

    document.getElementById("date").value = new Date().toLocaleDateString("en-CA");
    budgetInput.value = monthlyBudget || "";

    function money(value) {
      return new Intl.NumberFormat("en-NG", {
        style: "currency",
        currency: "NGN",
        minimumFractionDigits: 2
      }).format(value);
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    function currentMonthExpenses() {
      const now = new Date();
      return transactions
        .filter(t => t.type === "expense")
        .filter(t => {
          const d = new Date(t.date);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        })
        .reduce((sum, t) => sum + t.amount, 0);
    }

    function updateBudget() {
      if (!monthlyBudget) {
        budgetStatus.innerHTML = `<p style="color:var(--muted); margin:0; font-size:14px;">Set a monthly budget to track progress.</p>`;
        return;
      }
      const spent = currentMonthExpenses();
      const percent = Math.min(100, (spent / monthlyBudget) * 100);
      const remaining = monthlyBudget - spent;
      budgetStatus.innerHTML = `
        <div style="font-size:14.5px;">Spent this month: <strong>${money(spent)}</strong> of ${money(monthlyBudget)}</div>
        <div class="budget-bar"><div class="budget-fill" style="width:${percent}%; background:${percent > 90 ? 'var(--expense)' : 'var(--primary)'}"></div></div>
        <div style="margin-top:8px; font-size:13.5px; color:${remaining < 0 ? 'var(--expense)' : 'var(--income)'}">
          ${remaining >= 0 ? `Remaining: ${money(remaining)}` : `Over budget by ${money(Math.abs(remaining))}`}
        </div>
      `;
    }

    function updateCategories() {
      const expenses = transactions.filter(t => t.type === "expense");
      if (!expenses.length) {
        categoryPanel.style.display = "none";
        return;
      }
      const totals = {};
      expenses.forEach(t => { totals[t.category] = (totals[t.category] || 0) + t.amount; });
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      const max = sorted[0][1];
      categoryList.innerHTML = sorted.map(([cat, amt]) => `
        <div>
          <div class="cat-row">
            <span>${cat}</span>
            <strong>${money(amt)}</strong>
          </div>
          <div class="cat-bar"><div class="cat-fill" style="width:${(amt / max) * 100}%"></div></div>
        </div>
      `).join("");
      categoryPanel.style.display = "block";
    }

    function render() {
      const income = transactions.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);
      const expenses = transactions.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0);
      const balance = income - expenses;

      document.getElementById("balance").textContent = money(balance);
      document.getElementById("balance").className = balance < 0 ? "expense" : "";
      document.getElementById("income").textContent = money(income);
      document.getElementById("expenses").textContent = money(expenses);

      updateBudget();
      updateCategories();

      const visible = transactions
        .filter(t => filter.value === "all" || t.type === filter.value)
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date));

      list.innerHTML = "";
      if (!visible.length) {
        list.innerHTML = `<p class="empty">No transactions yet. Add your first one above.</p>`;
        return;
      }

      visible.forEach(t => {
        const row = document.createElement("div");
        row.className = "transaction";
        row.innerHTML = `
          <div>
            <div class="tx-name">${t.description}</div>
            <div class="tx-meta">${t.category} · ${t.date}</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount ${t.type}">${t.type === "income" ? "+" : "−"}${money(t.amount)}</div>
            <button class="delete" type="button">Delete</button>
          </div>
        `;
        row.querySelector(".delete").addEventListener("click", () => {
          transactions = transactions.filter(item => item.id !== t.id);
          save();
          render();
        });
        list.appendChild(row);
      });
    }

    saveBudgetBtn.addEventListener("click", () => {
      monthlyBudget = Number(budgetInput.value) || 0;
      localStorage.setItem(BUDGET_KEY, monthlyBudget);
      updateBudget();
    });

    form.addEventListener("submit", e => {
      e.preventDefault();
      const description = document.getElementById("description").value.trim();
      const amount = Number(document.getElementById("amount").value);
      const date = document.getElementById("date").value;
      if (!description || !Number.isFinite(amount) || amount <= 0 || !date) {
        alert("Please enter a description, a valid positive amount, and a date.");
        return;
      }
      transactions.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        description, amount, date,
        type: document.getElementById("type").value,
        category: document.getElementById("category").value
      });
      save();
      form.reset();
      document.getElementById("date").value = new Date().toLocaleDateString("en-CA");
      render();
    });

    filter.addEventListener("change", render);
    render();
  </script>
</body>
</html>
